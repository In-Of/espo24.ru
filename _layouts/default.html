<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.seo_title %}{{ page.seo_title }}{% elsif page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="{{ page.seo_title | default: page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  {% if page.faq and page.faq.size > 0 %}<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{% for f in page.faq %}{"@type":"Question","name":{{ f.q | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ f.a | jsonify }}}}{% unless forloop.last %},{% endunless %}{% endfor %}]}</script>{% endif %}
</head>
<body>
<header class="top"><div class="wrap top__in">
  <a href="/" class="logo">espo<span>24</span></a>
  <nav class="nav"><a href="/#spravochnik">Справочник</a><a href="/#pereezd">Переезд с Б24</a></nav>
  <a href="https://prosto-24.ru/" class="btn">CRM за 24 часа</a>
</div></header>
<main>{{ content }}</main>
<footer class="foot"><div class="wrap">
  <p>espo24.ru — независимый проект команды внедрения <a href="https://prosto-24.ru/">Просто24</a>. Не официальный сайт EspoCRM.</p>
  <p class="small">EspoCRM — товарный знак EspoCRM, Inc. Битрикс24 — товарный знак его правообладателя.</p>
</div></footer>
</body>
</html>
